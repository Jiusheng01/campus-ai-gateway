services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: campus_gateway
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  gateway-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://campus:campus@postgres:5432/campus_gateway?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      API_KEY_HMAC_SECRET: "change-me-in-production"
      THINKWATCH_URL: "http://host.docker.internal:8788"
      THINKWATCH_GATEWAY_KEY: ""
    depends_on: [postgres, redis]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [gateway-server]
volumes:
  postgres_data:
  redis_data:
