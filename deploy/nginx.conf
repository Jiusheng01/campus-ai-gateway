events {}
http {
  upstream campus_gateway { server gateway-server:8080; }
  server {
    listen 80;
    location / {
      proxy_pass http://campus_gateway;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      # $http_host, not $host: $host drops the port the client used. The admin
      # console's same-origin check compares this against the browser's Origin
      # header, which keeps its port, so publishing this stack on 8088 (as
      # docker-compose.yml does) with $host made every refresh look cross-site
      # and sent the operator back to the login screen on reload.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header X-Accel-Buffering no;
    }
  }
}
