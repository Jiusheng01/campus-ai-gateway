events {}
http {
  upstream campus_gateway {
    least_conn;
    server gateway-1:8080;
    server gateway-2:8080;
    keepalive 128;
  }

  server {
    listen 80;
    server_name gateway.example.edu;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name gateway.example.edu;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://campus_gateway;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      # $http_host preserves the client's authority, including the port. $host
      # strips it, and the admin console's same-origin check compares this
      # against the browser's Origin (which keeps its port) — with $host on a
      # non-default port every refresh was refused as cross-site and the
      # operator was returned to the login screen on reload.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      # Overwrite rather than append: a caller who can prepend an address
      # chooses the one the gateway records and rate-limits on. If another
      # proxy sits in front of this one, add it to TRUSTED_PROXY_CIDRS and use
      # $proxy_add_x_forwarded_for here instead — the chain is then built by a
      # hop that already stripped the client's own header.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      add_header X-Accel-Buffering no;
    }
  }
}
