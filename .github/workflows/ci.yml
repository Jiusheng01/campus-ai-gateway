name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Admin UI dependencies
        run: npm --prefix web/admin install --no-audit --no-fund

      - name: Check Admin UI
        run: npm --prefix web/admin run check

      - name: Build Admin UI
        run: npm --prefix web/admin run build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Download Go modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
