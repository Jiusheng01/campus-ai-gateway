name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The integration tests need a database and a cache, and they SKIP when
    # neither answers — which silently removed the schema contract, the quota
    # round-trips and the concurrency tests from CI. The services below are what
    # those tests look for by default (127.0.0.1:5432 and 127.0.0.1:6379), so a
    # green run now covers what a local run covers.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_gateway
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U campus -d campus_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Spelled out rather than left to the defaults so the dependency is
      # visible: the same values the services expose above.
      TEST_DATABASE_URL: "postgres://campus:campus@127.0.0.1:5432/campus_gateway_test?sslmode=disable"
      TEST_REDIS_ADDR: "127.0.0.1:6379"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Admin UI dependencies
        run: npm --prefix web/admin install --no-audit --no-fund

      - name: Check Admin UI
        run: npm --prefix web/admin run check

      # Runs the component tests (jsdom, no browser download). They cover the
      # drawer's focus handling and the three-state limit input, both of which
      # are invisible to tsc and to the build.
      - name: Test Admin UI
        run: npm --prefix web/admin test

      - name: Build Admin UI
        run: npm --prefix web/admin run build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Download Go modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
