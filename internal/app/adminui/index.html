<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校园模型网关</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#18212f;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:#111827;color:#e5e7eb;padding:24px 16px}.brand{font-size:18px;font-weight:700;margin-bottom:24px}.brand small{display:block;font-size:11px;color:#94a3b8;font-weight:400;margin-top:6px}
nav button{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer;font-size:14px}
nav button.active,nav button:hover{background:#1f2937;color:white}
main{padding:26px;overflow:auto}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.topbar h1{margin:0;font-size:24px}.tokenbox{display:flex;gap:8px;align-items:center}.tokenbox input,input,select{border:1px solid #d7dce5;border-radius:8px;padding:9px 10px;background:white}
button.primary,button.secondary,button.danger{border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}.card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.metric{font-size:26px;font-weight:700;margin-top:8px}
.status{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#ef4444}.dot.ok{background:#22c55e}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}.toolbar h2{margin:0;font-size:18px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb}th,td{padding:11px 12px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;color:#475569}.muted{color:#64748b}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px}.oktag{background:#dcfce7;color:#166534}.badtag{background:#fee2e2;color:#991b1b}
.hidden{display:none}.panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px;font-size:13px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:14px}.flash{position:fixed;right:20px;bottom:20px;padding:12px 16px;border-radius:9px;background:#111827;color:white;display:none;max-width:420px}
.secret{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:8px;margin-top:12px;word-break:break-all}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">校园模型网关<small>Campus AI Gateway</small></div>
  <nav id="nav">
    <button data-page="dashboard" class="active">总览</button>
    <button data-page="providers">Provider 管理</button>
    <button data-page="models">模型管理</button>
    <button data-page="tenants">租户管理</button>
    <button data-page="keys">API Key 管理</button>
    <button data-page="logs">请求日志</button>
    <button data-page="adminAudit">管理审计</button>
    <button data-page="security">安全事件</button>
  </nav>
</aside>
<main>
  <div class="topbar">
    <h1 id="title">总览</h1>
    <div class="tokenbox">
      <input id="adminToken" type="password" placeholder="ADMIN_TOKEN">
      <button class="primary" id="saveToken">连接并记住</button>
      <button class="secondary" id="clearToken">清除</button>
    </div>
  </div>

  <section id="dashboard" class="page">
    <div class="grid" id="statusGrid"></div>
    <div class="grid" id="metricGrid" style="margin-top:14px"></div>
    <div class="panel" style="margin-top:16px">
      <b>使用说明</b>
      <p class="muted">管理 Token 默认保存在当前浏览器 localStorage，本机浏览器重开后无需重复输入。生产环境后续应切换为正式登录会话。Provider 页面只保存凭据环境变量名，不保存真实厂商 API Key。</p>
    </div>
  </section>

  <section id="providers" class="page hidden">
    <div class="toolbar"><h2>Provider</h2><div class="actions" style="margin-top:0"><button class="secondary" onclick="openProviderPreset('deepseek')">添加 DeepSeek</button><button class="primary" onclick="openProvider()">新增 Provider</button></div></div>
    <div id="providerForm" class="panel hidden"></div>
    <div id="providerTable"></div>
  </section>

  <section id="models" class="page hidden">
    <div class="toolbar"><h2>模型</h2><div class="actions" style="margin-top:0"><button class="secondary" onclick="syncThinkWatch()">同步到 ThinkWatch</button><button class="secondary" onclick="openModelTest()">测试模型</button><button class="primary" onclick="openModel()">新增模型</button></div></div>
    <div id="modelForm" class="panel hidden"></div>
    <div id="routePanel" class="panel hidden"></div>
    <div id="routeForm" class="panel hidden"></div>
    <div id="modelTest" class="panel hidden"></div>
    <div id="syncResult"></div>
    <div id="modelTable"></div>
  </section>

  <section id="tenants" class="page hidden">
    <div class="toolbar"><h2>租户</h2><button class="primary" onclick="openTenant()">新增租户</button></div>
    <div id="tenantForm" class="panel hidden"></div>
    <div id="tenantTable"></div>
  </section>

  <section id="keys" class="page hidden">
    <div class="toolbar"><h2>Virtual API Key</h2><button class="primary" onclick="openKey()">创建 Key</button></div>
    <div id="keyForm" class="panel hidden"></div>
    <div id="keyResult"></div>
    <div id="keyTable"></div>
  </section>

  <section id="logs" class="page hidden">
    <div class="toolbar"><h2>请求日志</h2><div class="actions" style="margin-top:0"><button class="secondary" onclick="exportLogs()">导出 CSV</button><button class="secondary" onclick="loadLogs()">刷新</button></div></div>
    <div class="panel"><div class="formgrid"><label>模型<input id="logModel"></label><label>Provider<input id="logProvider"></label><label>HTTP 状态<input id="logStatus" type="number"></label><label>Request ID<input id="logRequestID"></label><label>Failover<select id="logFailover"><option value="">全部</option><option value="true">是</option><option value="false">否</option></select></label></div><div class="actions"><button class="primary" onclick="loadLogs(true)">筛选</button><button class="secondary" onclick="clearLogFilters()">清空</button></div></div>
    <div id="logTable"></div>
    <div class="actions"><button class="secondary" onclick="prevLogs()">上一页</button><button class="secondary" onclick="nextLogs()">下一页</button><span class="muted" id="logPage"></span></div>
  </section>

  <section id="adminAudit" class="page hidden">
    <div class="toolbar"><h2>管理审计</h2><button class="secondary" onclick="loadAdminAudit()">刷新</button></div>
    <div id="adminAuditTable"></div>
  </section>

  <section id="security" class="page hidden">
    <div class="toolbar"><h2>安全事件</h2><button class="secondary" onclick="loadSecurityEvents()">刷新</button></div>
    <div id="securityTable"></div>
  </section>
</main>
</div>
<div id="flash" class="flash"></div>
<script>
const state={providers:[],models:[],tenants:[],keys:[],routes:[],routeModel:null,logOffset:0,logLimit:50};
const tokenInput=document.getElementById('adminToken');
tokenInput.value=localStorage.getItem('campus_admin_token')||sessionStorage.getItem('campus_admin_token')||'';
if(tokenInput.value){localStorage.setItem('campus_admin_token',tokenInput.value);sessionStorage.removeItem('campus_admin_token');}

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function notify(msg){const e=document.getElementById('flash');e.textContent=msg;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
async function api(path,opt={}){
  const token=localStorage.getItem('campus_admin_token')||'';
  const headers=Object.assign({'Authorization':'Bearer '+token},opt.headers||{});
  if(opt.body)headers['Content-Type']='application/json';
  const r=await fetch(path,Object.assign({},opt,{headers}));
  const txt=await r.text(); let data={}; try{data=txt?JSON.parse(txt):{}}catch{data={raw:txt}}
  if(!r.ok){throw new Error(data?.error?.message||('HTTP '+r.status))}
  return data;
}
document.getElementById('saveToken').onclick=async()=>{
  localStorage.setItem('campus_admin_token',tokenInput.value.trim());
  try{await loadDashboard();notify('管理接口连接成功')}catch(e){notify(e.message)}
};
document.getElementById('clearToken').onclick=()=>{
  localStorage.removeItem('campus_admin_token');
  sessionStorage.removeItem('campus_admin_token');
  tokenInput.value='';
  notify('已清除本机保存的管理 Token');
};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.page).classList.remove('hidden');
  document.getElementById('title').textContent=b.textContent;
  ({dashboard:loadDashboard,providers:loadProviders,models:loadModels,tenants:loadTenants,keys:loadKeys,logs:loadLogs,adminAudit:loadAdminAudit,security:loadSecurityEvents}[b.dataset.page])().catch(e=>notify(e.message));
});

async function loadDashboard(){
  const d=await api('/admin/status');
  const statuses=[['Gateway',d.gateway],['PostgreSQL',d.postgres],['Redis',d.redis],['ThinkWatch',d.thinkwatch]];
  document.getElementById('statusGrid').innerHTML=statuses.map(([n,ok])=>'<div class="card"><div class="status"><span class="dot '+(ok?'ok':'')+'"></span><b>'+esc(n)+'</b></div><div class="muted" style="margin-top:8px">'+(ok?'运行正常':'不可用')+'</div></div>').join('');
  const s=d.stats||{};
  const metrics=[['今日请求',s.today_requests||0],['今日 Tokens',s.today_tokens||0],['今日错误',s.today_errors||0],['平均延迟',Math.round(s.avg_latency_ms||0)+' ms'],['P95 延迟',Math.round(s.p95_latency_ms||0)+' ms'],['Failover',s.failover_count||0]];
  const providers=(d.provider_stats||[]).map(v=>['Provider '+v.provider,Number(v.success_rate||0).toFixed(1)+'% 成功 / '+Math.round(v.avg_latency_ms||0)+' ms']);
  document.getElementById('metricGrid').innerHTML=metrics.concat(providers).map(([n,v])=>'<div class="card"><span class="muted">'+n+'</span><div class="metric">'+esc(v)+'</div></div>').join('');
}
async function loadProviders(){
  const d=await api('/admin/providers');state.providers=d.data||[];
  document.getElementById('providerTable').innerHTML='<table><thead><tr><th>名称</th><th>Base URL</th><th>协议</th><th>凭据环境变量</th><th>状态</th><th></th></tr></thead><tbody>'+
  state.providers.map(v=>'<tr><td><b>'+esc(v.name)+'</b></td><td>'+esc(v.base_url)+'</td><td>'+esc(v.protocol)+'</td><td><code>'+esc(v.credential_env)+'</code></td><td>'+(v.status===1?'<span class="tag oktag">启用</span>':'<span class="tag badtag">停用</span>')+'</td><td><button class="secondary" onclick=\'openProvider('+JSON.stringify(v).replace(/'/g,"&#39;")+')\'>编辑</button></td></tr>').join('')+'</tbody></table>';
}
function openProviderPreset(name){
  const presets={
    deepseek:{name:'deepseek',base_url:'https://api.deepseek.com/v1',protocol:'openai-chat',credential_env:'DEEPSEEK_API_KEY',status:1},
    qwen:{name:'qwen',base_url:'https://dashscope.aliyuncs.com/compatible-mode/v1',protocol:'openai-chat',credential_env:'DASHSCOPE_API_KEY',status:1}
  };
  openProvider(presets[name]||{});
}
function openProvider(v={}){
  const f=document.getElementById('providerForm');f.classList.remove('hidden');
  f.innerHTML='<div class="formgrid"><label>名称<input id="pName" value="'+esc(v.name||'')+'"></label><label>协议<select id="pProtocol"><option>openai-chat</option><option>openai-responses</option><option>anthropic</option><option>gemini</option></select></label><label class="full">Base URL<input id="pURL" value="'+esc(v.base_url||'')+'"></label><label>凭据环境变量<input id="pEnv" value="'+esc(v.credential_env||'')+'" placeholder="DASHSCOPE_API_KEY"></label><label>状态<select id="pStatus"><option value="1">启用</option><option value="2">停用</option></select></label></div><div class="actions"><button class="primary" id="pSave">保存</button><button class="secondary" onclick="this.closest(\'.panel\').classList.add(\'hidden\')">取消</button></div>';
  document.getElementById('pProtocol').value=v.protocol||'openai-chat';document.getElementById('pStatus').value=v.status||1;
  document.getElementById('pSave').onclick=async()=>{const body={name:pName.value,base_url:pURL.value,protocol:pProtocol.value,credential_env:pEnv.value,status:+pStatus.value};await api(v.id?'/admin/providers/'+v.id:'/admin/providers',{method:v.id?'PUT':'POST',body:JSON.stringify(body)});notify('Provider 已保存');f.classList.add('hidden');loadProviders()};
}
async function loadModels(){
  const [m,p]=await Promise.all([api('/admin/models'),api('/admin/providers')]);state.models=m.data||[];state.providers=p.data||[];
  document.getElementById('modelTable').innerHTML='<table><thead><tr><th>虚拟模型</th><th>主 Provider</th><th>主上游模型</th><th>状态</th><th>线路</th><th></th></tr></thead><tbody>'+
  state.models.map((v,i)=>'<tr><td><b>'+esc(v.alias)+'</b></td><td>'+esc(v.provider_name)+'</td><td>'+esc(v.upstream_model)+'</td><td>'+(v.status===1?'<span class="tag oktag">启用</span>':'<span class="tag badtag">停用</span>')+'</td><td><button class="secondary" onclick="openRoutes('+i+')">管理线路</button></td><td><button class="secondary" onclick=\'openModel('+JSON.stringify(v).replace(/'/g,"&#39;")+')\'>编辑</button></td></tr>').join('')+'</tbody></table>';
}
async function openModel(v={}){
  if(!state.providers.length){const p=await api('/admin/providers');state.providers=p.data||[]}
  const f=document.getElementById('modelForm');f.classList.remove('hidden');
  f.innerHTML='<div class="formgrid"><label>虚拟模型 Alias<input id="mAlias" value="'+esc(v.alias||'')+'" placeholder="campus-smart"></label><label>Provider<select id="mProvider">'+state.providers.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select></label><label class="full">上游模型<input id="mUpstream" value="'+esc(v.upstream_model||'')+'"></label><label>状态<select id="mStatus"><option value="1">启用</option><option value="2">停用</option></select></label></div><div class="actions"><button class="primary" id="mSave">保存</button><button class="secondary" onclick="this.closest(\'.panel\').classList.add(\'hidden\')">取消</button></div>';
  if(v.provider_id)mProvider.value=v.provider_id;mStatus.value=v.status||1;
  mSave.onclick=async()=>{const body={alias:mAlias.value,provider_id:mProvider.value,upstream_model:mUpstream.value,status:+mStatus.value};await api(v.id?'/admin/models/'+v.id:'/admin/models',{method:v.id?'PUT':'POST',body:JSON.stringify(body)});notify('模型已保存');f.classList.add('hidden');loadModels()};
}

async function openRoutes(modelIndex){
  const v=state.models[modelIndex];
  if(!v)return;
  state.routeModel=v;
  const d=await api('/admin/models/'+v.id+'/routes');
  state.routes=d.data||[];
  const p=document.getElementById('routePanel');p.classList.remove('hidden');
  document.getElementById('routeForm').classList.add('hidden');
  p.innerHTML='<div class="toolbar" style="margin:0 0 12px"><h2>'+esc(v.alias)+' · Provider 线路</h2><div class="actions" style="margin-top:0"><button class="primary" onclick="openRouteEditor()">新增线路</button><button class="secondary" onclick="closeRoutes()">关闭</button></div></div>'+
  '<p class="muted">优先级数字越小越优先；相同优先级按权重用于后续路由策略。当前主线路会自动同步到旧 Model 字段保持兼容。</p>'+
  '<table><thead><tr><th>Provider</th><th>上游模型</th><th>优先级</th><th>权重</th><th>超时</th><th>状态</th><th></th></tr></thead><tbody>'+
  state.routes.map((r,i)=>'<tr><td><b>'+esc(r.provider_name)+'</b></td><td>'+esc(r.upstream_model)+'</td><td>'+r.priority+'</td><td>'+r.weight+'</td><td>'+r.timeout_ms+' ms</td><td>'+(r.status===1?'<span class="tag oktag">启用</span>':'<span class="tag badtag">停用</span>')+'</td><td><div class="actions" style="margin:0"><button class="secondary" onclick="openRouteEditor('+i+')">编辑</button><button class="danger" onclick="deleteRoute('+i+')">删除</button></div></td></tr>').join('')+
  '</tbody></table>';
}
function closeRoutes(){
  document.getElementById('routePanel').classList.add('hidden');
  document.getElementById('routeForm').classList.add('hidden');
  state.routes=[];state.routeModel=null;
}
async function openRouteEditor(routeIndex){
  if(!state.routeModel)return;
  if(!state.providers.length)state.providers=(await api('/admin/providers')).data||[];
  const v=Number.isInteger(routeIndex)?state.routes[routeIndex]:{};
  const f=document.getElementById('routeForm');f.classList.remove('hidden');
  f.innerHTML='<b>'+(v.id?'编辑线路':'新增线路')+'</b><div class="formgrid" style="margin-top:12px"><label>Provider<select id="rProvider">'+state.providers.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('')+'</select></label><label>上游模型<input id="rUpstream" value="'+esc(v.upstream_model||'')+'" placeholder="deepseek-chat"></label><label>优先级<input id="rPriority" type="number" min="1" value="'+(v.priority||1)+'"></label><label>权重<input id="rWeight" type="number" min="0" value="'+(v.weight??100)+'"></label><label>超时(ms)<input id="rTimeout" type="number" min="1" value="'+(v.timeout_ms||60000)+'"></label><label>状态<select id="rStatus"><option value="1">启用</option><option value="2">停用</option></select></label></div><div class="actions"><button class="primary" id="rSave">保存线路</button><button class="secondary" onclick="document.getElementById(\'routeForm\').classList.add(\'hidden\')">取消</button></div>';
  if(v.provider_id)document.getElementById('rProvider').value=v.provider_id;
  document.getElementById('rStatus').value=v.status||1;
  document.getElementById('rSave').onclick=async()=>{
    const body={provider_id:document.getElementById('rProvider').value,upstream_model:document.getElementById('rUpstream').value,priority:+document.getElementById('rPriority').value,weight:+document.getElementById('rWeight').value,timeout_ms:+document.getElementById('rTimeout').value,status:+document.getElementById('rStatus').value};
    await api(v.id?'/admin/model-routes/'+v.id:'/admin/models/'+state.routeModel.id+'/routes',{method:v.id?'PUT':'POST',body:JSON.stringify(body)});
    notify('模型线路已保存');f.classList.add('hidden');
    await openRoutes(state.models.findIndex(x=>x.id===state.routeModel.id));
    await loadModels();
  };
}
async function deleteRoute(routeIndex){
  const v=state.routes[routeIndex];
  if(!v||!confirm('确认删除 '+v.provider_name+' → '+v.upstream_model+' 线路吗？'))return;
  await api('/admin/model-routes/'+v.id,{method:'DELETE'});
  notify('模型线路已删除');
  await openRoutes(state.models.findIndex(x=>x.id===state.routeModel.id));
  await loadModels();
}

async function syncThinkWatch(){
  if(!confirm('将数据库中启用的 Provider / Model 同步到 ThinkWatch config.yaml，并自动创建备份。继续吗？'))return;
  try{
    const out=await api('/admin/thinkwatch/sync',{method:'POST'});
    document.getElementById('syncResult').innerHTML='<div class="secret"><b>同步成功</b><br>Provider: '+esc(out.providers)+'，Alias: '+esc(out.aliases)+'<br><span class="muted">配置：'+esc(out.config_path)+'<br>备份：'+esc(out.backup_path)+'</span></div>';
    notify('ThinkWatch 配置已同步');
    setTimeout(()=>loadDashboard().catch(()=>{}),1500);
  }catch(e){notify(e.message)}
}
async function openModelTest(){
  if(!state.models.length){const m=await api('/admin/models');state.models=m.data||[]}
  const active=state.models.filter(v=>v.status===1);
  const f=document.getElementById('modelTest');f.classList.remove('hidden');
  f.innerHTML='<b>模型连通性测试</b><div class="formgrid" style="margin-top:12px"><label>模型<select id="testModel">'+active.map(m=>'<option value="'+esc(m.alias)+'">'+esc(m.alias)+' → '+esc(m.upstream_model)+'</option>').join('')+'</select></label><label class="full">提示词<textarea id="testPrompt" rows="4" style="border:1px solid #d7dce5;border-radius:8px;padding:10px;font:inherit;resize:vertical">请只回复 OK</textarea></label></div><div class="actions"><button class="primary" id="runModelTest">发送测试</button><button class="secondary" onclick="this.closest(\'.panel\').classList.add(\'hidden\')">关闭</button></div><div id="modelTestResult"></div>';
  document.getElementById('runModelTest').onclick=async()=>{
    const btn=document.getElementById('runModelTest');btn.disabled=true;btn.textContent='测试中...';
    try{
      const out=await api('/admin/model-test',{method:'POST',body:JSON.stringify({model:document.getElementById('testModel').value,prompt:document.getElementById('testPrompt').value})});
      document.getElementById('modelTestResult').innerHTML='<div class="secret"><b>测试成功</b><br><b>响应：</b> '+esc(out.content||'(空)')+'<br><span class="muted">model='+esc(out.model)+' · tokens='+esc(out.total_tokens)+' · latency='+esc(out.latency_ms)+' ms</span></div>';
      notify('模型测试成功');
    }catch(e){
      document.getElementById('modelTestResult').innerHTML='<div class="secret"><b>测试失败</b><br>'+esc(e.message)+'</div>';
      notify(e.message);
    }finally{btn.disabled=false;btn.textContent='发送测试'}
  };
}
async function loadTenants(){
  const d=await api('/admin/tenants');state.tenants=d.data||[];
  document.getElementById('tenantTable').innerHTML='<table><thead><tr><th>编码</th><th>名称</th><th>状态</th><th></th></tr></thead><tbody>'+
  state.tenants.map((v,i)=>'<tr><td><code>'+esc(v.code)+'</code></td><td><b>'+esc(v.name)+'</b></td><td>'+(v.status===1?'<span class="tag oktag">启用</span>':'<span class="tag badtag">停用</span>')+'</td><td><div class="actions" style="margin:0"><button class="secondary" onclick="showTenantUsage('+i+')">用量</button><button class="secondary" onclick=\'openTenant('+JSON.stringify(v).replace(/'/g,"&#39;")+')\'>编辑</button></div></td></tr>').join('')+'</tbody></table>';
}
function openTenant(v={}){
  const f=document.getElementById('tenantForm');f.classList.remove('hidden');
  f.innerHTML='<div class="formgrid"><label>租户编码<input id="tCode" value="'+esc(v.code||'')+'" placeholder="itc"></label><label>租户名称<input id="tName" value="'+esc(v.name||'')+'" placeholder="信息网络中心"></label><label>每日 Token 上限（0=不限）<input id="tDailyTokens" type="number" min="0" value="'+(v.daily_token_limit||0)+'"></label><label>每月 Token 上限（0=不限）<input id="tMonthlyTokens" type="number" min="0" value="'+(v.monthly_token_limit||0)+'"></label><label>每月请求上限（0=不限）<input id="tMonthlyRequests" type="number" min="0" value="'+(v.monthly_request_limit||0)+'"></label><label>月预算 micros（0=不限）<input id="tBudget" type="number" min="0" value="'+(v.monthly_budget_micros||0)+'"></label><label>状态<select id="tStatus"><option value="1">启用</option><option value="2">停用</option></select></label></div><div class="actions"><button class="primary" id="tSave">保存</button><button class="secondary" onclick="this.closest(\'.panel\').classList.add(\'hidden\')">取消</button></div>';
  document.getElementById('tStatus').value=v.status||1;
  document.getElementById('tSave').onclick=async()=>{
    const body={code:document.getElementById('tCode').value,name:document.getElementById('tName').value,status:+document.getElementById('tStatus').value,daily_token_limit:+document.getElementById('tDailyTokens').value,monthly_token_limit:+document.getElementById('tMonthlyTokens').value,monthly_request_limit:+document.getElementById('tMonthlyRequests').value,monthly_budget_micros:+document.getElementById('tBudget').value};
    await api(v.id?'/admin/tenants/'+v.id:'/admin/tenants',{method:v.id?'PUT':'POST',body:JSON.stringify(body)});
    notify('租户已保存');f.classList.add('hidden');await loadTenants();
  };
}

async function loadKeys(){
  const [k,t,m]=await Promise.all([api('/admin/api-keys'),api('/admin/tenants'),api('/admin/models')]);state.keys=k.data||[];state.tenants=t.data||[];state.models=m.data||[];
  document.getElementById('keyTable').innerHTML='<table><thead><tr><th>名称</th><th>租户</th><th>Key 前缀</th><th>模型</th><th>RPM/TPM/并发</th><th>状态</th><th></th></tr></thead><tbody>'+
  state.keys.map(v=>'<tr><td><b>'+esc(v.name)+'</b></td><td>'+esc(v.tenant_name)+'</td><td><code>'+esc(v.key_prefix)+'</code></td><td>'+esc((v.allowed_models||[]).join(', '))+'</td><td>'+v.rpm_limit+' / '+v.tpm_limit+' / '+v.max_concurrency+'</td><td>'+(v.status===1?'<span class="tag oktag">启用</span>':'<span class="tag badtag">停用</span>')+'</td><td><button class="secondary" onclick=\'openKey('+JSON.stringify(v).replace(/'/g,"&#39;")+')\'>编辑</button></td></tr>').join('')+'</tbody></table>';
}
async function openKey(v={}){
  if(!state.tenants.length)state.tenants=(await api('/admin/tenants')).data||[];
  if(!state.models.length)state.models=(await api('/admin/models')).data||[];
  const f=document.getElementById('keyForm');f.classList.remove('hidden');
  const selected=v.allowed_models||[];
  f.innerHTML='<div class="formgrid"><label>名称<input id="kName" value="'+esc(v.name||'')+'"></label><label>租户<select id="kTenant">'+state.tenants.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+' ('+esc(t.code)+')</option>').join('')+'</select></label><label>RPM<input id="kRPM" type="number" value="'+(v.rpm_limit||60)+'"></label><label>TPM<input id="kTPM" type="number" value="'+(v.tpm_limit||100000)+'"></label><label>最大并发<input id="kConcurrency" type="number" value="'+(v.max_concurrency||10)+'"></label><label>状态<select id="kStatus"><option value="1">启用</option><option value="2">停用</option></select></label><label class="full">允许模型（逗号分隔）<input id="kModels" value="'+esc(selected.join(','))+'" placeholder="campus-smart"></label><label class="full">允许 IP（逗号分隔，空=不限）<input id="kIPs" value="'+esc((v.allowed_ips||[]).join(','))+'"></label></div><div class="actions"><button class="primary" id="kSave">保存</button><button class="secondary" onclick="this.closest(\'.panel\').classList.add(\'hidden\')">取消</button></div>';
  if(v.tenant_id)kTenant.value=v.tenant_id;kStatus.value=v.status||1;
  kSave.onclick=async()=>{const body={name:kName.value,tenant_id:kTenant.value,status:+kStatus.value,allowed_models:kModels.value.split(',').map(x=>x.trim()).filter(Boolean),allowed_ips:kIPs.value.split(',').map(x=>x.trim()).filter(Boolean),rpm_limit:+kRPM.value,tpm_limit:+kTPM.value,max_concurrency:+kConcurrency.value,route_group:v.route_group||''};const out=await api(v.id?'/admin/api-keys/'+v.id:'/admin/api-keys',{method:v.id?'PUT':'POST',body:JSON.stringify(body)});f.classList.add('hidden');if(out.api_key){document.getElementById('keyResult').innerHTML='<div class="secret"><b>新 Key 只显示这一次，请立即保存：</b><br><code>'+esc(out.api_key)+'</code></div>'}notify('API Key 已保存');loadKeys()};
}
function logQuery(){
  const q=new URLSearchParams({limit:String(state.logLimit),offset:String(state.logOffset)});
  const vals={model:logModel.value,provider:logProvider.value,status:logStatus.value,request_id:logRequestID.value,failover:logFailover.value};
  Object.entries(vals).forEach(([k,v])=>{if(v)q.set(k,v)});
  return q;
}
async function loadLogs(reset=false){
  if(reset)state.logOffset=0;
  const d=await api('/admin/request-logs?'+logQuery().toString());const rows=d.data||[];
  document.getElementById('logTable').innerHTML='<table><thead><tr><th>时间</th><th>Request ID</th><th>路由</th><th>Token</th><th>延迟</th><th>状态</th></tr></thead><tbody>'+
  rows.map(v=>'<tr><td>'+esc(new Date(v.created_at).toLocaleString())+'</td><td><code>'+esc(v.request_id)+'</code></td><td>'+esc(v.requested_model)+' → '+esc(v.provider||'?')+' / '+esc(v.upstream_model||v.actual_model||'?')+(v.failover?' <span class="tag">Failover '+v.attempts+'x</span>':'')+'</td><td>'+v.total_tokens+'</td><td>'+v.latency_ms+' ms</td><td>'+(v.status_code<400?'<span class="tag oktag">'+v.status_code+'</span>':'<span class="tag badtag">'+v.status_code+' '+esc(v.error_code)+'</span>')+'</td></tr>').join('')+'</tbody></table>';
  document.getElementById('logPage').textContent='offset '+state.logOffset+' · 本页 '+rows.length;
}
function nextLogs(){state.logOffset+=state.logLimit;loadLogs()}
function prevLogs(){state.logOffset=Math.max(0,state.logOffset-state.logLimit);loadLogs()}
function clearLogFilters(){logModel.value='';logProvider.value='';logStatus.value='';logRequestID.value='';logFailover.value='';loadLogs(true)}
function exportLogs(){window.open('/admin/request-logs/export?'+logQuery().toString(),'_blank')}
async function showTenantUsage(index){
  const t=state.tenants[index];if(!t)return;
  const u=await api('/admin/tenants/'+t.id+'/usage');
  notify(t.name+'：今日 '+u.daily_requests+' 请求 / '+u.daily_tokens+' tokens；本月 '+u.monthly_requests+' 请求 / '+u.monthly_tokens+' tokens');
}
async function loadAdminAudit(){
  const d=await api('/admin/admin-audit?limit=200');const rows=d.data||[];
  document.getElementById('adminAuditTable').innerHTML='<table><thead><tr><th>时间</th><th>用户</th><th>操作</th><th>资源</th><th>状态</th></tr></thead><tbody>'+rows.map(v=>'<tr><td>'+esc(new Date(v.created_at).toLocaleString())+'</td><td>'+esc(v.actor)+'</td><td>'+esc(v.action)+'</td><td><code>'+esc(v.resource)+'</code></td><td>'+v.status_code+'</td></tr>').join('')+'</tbody></table>';
}
async function loadSecurityEvents(){
  const d=await api('/admin/security-events?limit=200');const rows=d.data||[];
  document.getElementById('securityTable').innerHTML='<table><thead><tr><th>时间</th><th>事件</th><th>Tenant/Key</th><th>模型</th><th>来源</th><th>详情</th></tr></thead><tbody>'+rows.map(v=>'<tr><td>'+esc(new Date(v.created_at).toLocaleString())+'</td><td><span class="tag badtag">'+esc(v.event_type)+'</span></td><td><code>'+esc(v.tenant_id||'')+' '+esc(v.api_key_id||'')+'</code></td><td>'+esc(v.requested_model||'')+'</td><td>'+esc(v.client_ip||'')+'</td><td>'+esc(v.detail||'')+'</td></tr>').join('')+'</tbody></table>';
}
if(tokenInput.value){loadDashboard().catch(()=>{})}
</script>
</body>
